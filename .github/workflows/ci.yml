name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  build:
    name: Build (linux-x86_64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/gtnh-updater dist/
          cp README.md LICENSE dist/
          tar -C dist -czf gtnh-updater-linux-x86_64.tar.gz gtnh-updater README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: gtnh-updater-linux-x86_64
          path: gtnh-updater-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gtnh-updater-linux-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          files: gtnh-updater-linux-x86_64.tar.gz
          generate_release_notes: true
